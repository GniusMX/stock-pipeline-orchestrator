name: Run Full Stock Pipeline

on:
  schedule:
    - cron: '37 21 * * *' # 日本時間 06:37（UTC 21:37）
  workflow_dispatch: # 手動実行用ボタン

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"  # a5_ml.py の __pycache__ を作らない（git add . で誤ってコミットされるのを防ぐ）
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy scikit-learn==1.8.0

      # --- 1. stock-data-ai の実行と自動コミット ---
      - name: 1. Run stock-data-ai
        run: |
          git clone https://x-access-token:${{ secrets.GHA_PAT }}@github.com/GniusMX/stock-data-ai.git repo1
          cd repo1
          python main.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto: Update market data"
            ok=0
            for i in 1 2 3 4 5; do
              if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
              echo "push失敗（他の更新と重なった）。${i}回目。待って再試行します"
              git rebase --abort 2>/dev/null || true
              sleep $((i * 8))
            done
            [ "$ok" = 1 ] || exit 1
          fi

      # --- 2. stock-rule-parameters の実行と自動コミット ---
      - name: 2. Run stock-rule-parameters
        env:
          GHA_PAT: ${{ secrets.GHA_PAT }}   # stock-data-ai を非公開にしても読めるよう、② に渡す
        run: |
          git clone https://x-access-token:${{ secrets.GHA_PAT }}@github.com/GniusMX/stock-rule-parameters.git repo2
          cd repo2
          python main.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SMH_rule_parameters.csv QQQ_rule_parameters.csv
          if ! git diff --staged --quiet; then
            git commit -m "Auto: Update parameters"
            ok=0
            for i in 1 2 3 4 5; do
              if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
              echo "push失敗（他の更新と重なった）。${i}回目。待って再試行します"
              git rebase --abort 2>/dev/null || true
              sleep $((i * 8))
            done
            [ "$ok" = 1 ] || exit 1
          fi

      # --- 3. stock-rule-engine の実行と自動コミット ---
      - name: 3. Run stock-rule-engine
        env:
          PARAMETER_REPO_TOKEN: ${{ secrets.GHA_PAT }}
        run: |
          git clone https://x-access-token:${{ secrets.GHA_PAT }}@github.com/GniusMX/stock-rule-engine.git repo3
          cd repo3
          python main.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SMH_rule_decisions.csv QQQ_rule_decisions.csv latest_rule_decision.txt
          if ! git diff --staged --quiet; then
            git commit -m "Auto: Update rule decisions"
            ok=0
            for i in 1 2 3 4 5; do
              if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
              echo "push失敗（他の更新と重なった）。${i}回目。待って再試行します"
              git rebase --abort 2>/dev/null || true
              sleep $((i * 8))
            done
            [ "$ok" = 1 ] || exit 1
          fi
