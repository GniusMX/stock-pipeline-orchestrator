name: Run Full Stock Pipeline

on:
  schedule:
    - cron: '37 21 * * *' # 日本時間 06:37（UTC 21:37）
  workflow_dispatch: # 手動実行用ボタン

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"  # a5_ml.py の __pycache__ を作らない（git add . で誤ってコミットされるのを防ぐ）
      PYTHONUNBUFFERED: "1"         # 2026-11: ログの時刻が実際の進み具合と一致するように（どこで時間がかかっているかを見やすくする）
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy scikit-learn==1.8.0

      # 2026-11: 3つのリポジトリとも、最新の状態だけを取る（--depth 1）。
      #   以前は全履歴を取っていたため、毎日のコミットで履歴が大きくなるほど、取得（clone）に時間がかかっていた。
      #   最新の状態だけでも、実行・コミット・push は従来どおり動く。

      # --- 1. stock-data-ai の実行と自動コミット ---
      - name: 1. Run stock-data-ai
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.GHA_PAT }}@github.com/GniusMX/stock-data-ai.git repo1
          cd repo1
          python main.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || (git commit -m "Auto: Update market data" && git push)

      # --- 2. stock-rule-parameters の実行と自動コミット ---
      - name: 2. Run stock-rule-parameters
        env:
          # 2026-11: stock-data-ai のCSVを読むときにトークンを使う（取得が404になるのを防ぐ。公開でも非公開でも動く）
          DATA_REPO_TOKEN: ${{ secrets.GHA_PAT }}
          GHA_PAT: ${{ secrets.GHA_PAT }}
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.GHA_PAT }}@github.com/GniusMX/stock-rule-parameters.git repo2
          cd repo2
          python main.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SMH_rule_parameters.csv QQQ_rule_parameters.csv
          git diff --staged --quiet || (git commit -m "Auto: Update parameters" && git push)

      # --- 3. stock-rule-engine の実行と自動コミット ---
      - name: 3. Run stock-rule-engine
        env:
          PARAMETER_REPO_TOKEN: ${{ secrets.GHA_PAT }}
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.GHA_PAT }}@github.com/GniusMX/stock-rule-engine.git repo3
          cd repo3
          python main.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SMH_rule_decisions.csv QQQ_rule_decisions.csv latest_rule_decision.txt
          git diff --staged --quiet || (git commit -m "Auto: Update rule decisions" && git push)
