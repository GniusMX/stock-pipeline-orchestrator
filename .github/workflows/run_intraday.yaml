name: Run Intraday Decision (ベンザイテンシステム 場中判定)

# 場中判定モード: スケジュールでは、日本時間 03:00（米国の平日）に1回だけ自動で起動する。
# ①② を走らせてから ③ を --intraday で実行し、intraday_decision.txt だけをコミットする。
# 日次の run_pipeline.yaml はそのまま使う。手動実行（workflow_dispatch）はいつでもできる。
#
# GitHub の cron は UTC。日本時間 = UTC + 9 時間。
#   03:00 JST = UTC 18:00（曜日 1-5 は UTC の月〜金 = 米国の月〜金 = 日本時間の火〜土の早朝）
# 米東部の時刻: 冬時間（11月初め〜3月）13:00 / 夏時間（3月〜11月初め）14:00。どちらも引け（16:00）の3時間前／2時間前。
# 注意: GitHub の定時実行は混雑で数分〜数十分遅れることがある。引けに近いほど場中の ML の見積もりは正確になる。
# 時刻のガード（下の手順0）は、場中でないときだけスキップする。

on:
  schedule:
    - cron: '0 18 * * 1-5'    # 日本時間 03:00
  workflow_dispatch:

concurrency:
  group: stock-pipeline
  cancel-in-progress: false

jobs:
  run-intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: 0. 場中の時刻か確かめる
        id: guard
        run: |
          NY_HM=$(TZ=America/New_York date +%H:%M)
          NY_DOW=$(TZ=America/New_York date +%u)
          M=$((10#${NY_HM%:*} * 60 + 10#${NY_HM#*:}))
          echo "米東部の現在時刻: $NY_HM（曜日 $NY_DOW）"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          elif [ "$NY_DOW" -le 5 ] && [ "$M" -ge 570 ] && [ "$M" -lt 960 ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "米国の場中（米東部 9:30〜16:00 の平日）ではないためスキップします（夏時間の 05:00〜05:45 は引け後のため）"
            echo "go=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.go == '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.guard.outputs.go == '1'
        run: |
          pip install yfinance pandas numpy scikit-learn==1.8.0

      # --- 1. stock-data-ai（場中の暫定バーを含めて取得） ---
      - name: 1. Run stock-data-ai (intraday)
        if: steps.guard.outputs.go == '1'
        run: |
          # データを取った時刻（米東部）を ③ の --time に渡す
          echo "FETCH_TIME=$(TZ=America/New_York date +%H:%M)" >> "$GITHUB_ENV"
          git clone https://x-access-token:${{ secrets.GHA_PAT }}@github.com/GniusMX/stock-data-ai.git repo1
          cd repo1
          python main.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto: Intraday market data (provisional)"
            ok=0
            for i in 1 2 3 4 5; do
              # コミットしなかった変更（今回は保存の対象外）が残っていると pull --rebase が止まるため、先に捨てる
              git checkout -- .
              if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
              echo "push失敗（他の更新と重なった）。${i}回目。待って再試行します"
              git rebase --abort 2>/dev/null || true
              sleep $((i * 8))
            done
            [ "$ok" = 1 ] || exit 1
          fi

      # --- 2. stock-rule-parameters（③ はGitHub上のCSVを読むので push が必要） ---
      - name: 2. Run stock-rule-parameters (intraday)
        if: steps.guard.outputs.go == '1'
        env:
          GHA_PAT: ${{ secrets.GHA_PAT }}   # stock-data-ai を非公開にしても読めるよう、② に渡す
        run: |
          git clone https://x-access-token:${{ secrets.GHA_PAT }}@github.com/GniusMX/stock-rule-parameters.git repo2
          cd repo2
          python main.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SMH_rule_parameters.csv QQQ_rule_parameters.csv
          if ! git diff --staged --quiet; then
            git commit -m "Auto: Intraday parameters (provisional)"
            ok=0
            for i in 1 2 3 4 5; do
              # コミットしなかった変更（今回は保存の対象外）が残っていると pull --rebase が止まるため、先に捨てる
              git checkout -- .
              if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
              echo "push失敗（他の更新と重なった）。${i}回目。待って再試行します"
              git rebase --abort 2>/dev/null || true
              sleep $((i * 8))
            done
            [ "$ok" = 1 ] || exit 1
          fi

      # --- 3. stock-rule-engine を場中判定モードで実行 ---
      - name: 3. Run stock-rule-engine (--intraday)
        if: steps.guard.outputs.go == '1'
        env:
          PARAMETER_REPO_TOKEN: ${{ secrets.GHA_PAT }}
        run: |
          git clone https://x-access-token:${{ secrets.GHA_PAT }}@github.com/GniusMX/stock-rule-engine.git repo3
          cd repo3
          echo "データ取得時刻（米東部）: $FETCH_TIME"
          python main.py --intraday --time "$FETCH_TIME"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 場中の結果だけをコミットする（判定CSVと日次の latest_rule_decision.txt は日次の実行に任せる）
          git add intraday_decision.txt
          if ! git diff --staged --quiet; then
            git commit -m "Auto: Intraday decision (ET $FETCH_TIME)"
            ok=0
            for i in 1 2 3 4 5; do
              # コミットしなかった変更（今回は保存の対象外）が残っていると pull --rebase が止まるため、先に捨てる
              git checkout -- .
              if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
              echo "push失敗（他の更新と重なった）。${i}回目。待って再試行します"
              git rebase --abort 2>/dev/null || true
              sleep $((i * 8))
            done
            [ "$ok" = 1 ] || exit 1
          fi

      - name: 4. 結果を実行ログにも表示
        if: steps.guard.outputs.go == '1'
        run: |
          sed -n '1,40p' repo3/intraday_decision.txt
          
