.bg { fill: var(--surface); }
.ti { fill: var(--ink); font-size: 13px; font-weight: 600; }
.su { fill: var(--ink2); font-size: 11px; }
.pt { fill: var(--ink); font-size: 11px; font-weight: 600; }
.tk { fill: var(--muted); font-size: 10px; }
.lb { fill: var(--ink2); font-size: 11px; }
.nw { fill: var(--ink); font-size: 10.5px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.nn { fill: var(--neg); font-size: 10.5px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.gr { stroke: var(--grid); stroke-width: 1; fill: none; }
.ax { stroke: var(--axis); stroke-width: 1; fill: none; }
.zn { fill: var(--neg); fill-opacity: 0.07; }
.zp { fill: var(--pos); fill-opacity: 0.07; }
.bc { fill: var(--s1); }
.bp { fill: var(--s2); }
.bcl { fill: var(--s1); fill-opacity: 0.22; stroke: var(--s1); stroke-width: 0.9; stroke-opacity: 0.9; }
.bpl { fill: var(--s2); fill-opacity: 0.22; stroke: var(--s2); stroke-width: 0.9; stroke-opacity: 0.9; }
@media (prefers-color-scheme: dark) { .bcl, .bpl { fill-opacity: 0.35; } }
.cv2 { stroke: var(--cv); stroke-width: 1.4; stroke-dasharray: 5 3; fill: none; stroke-linejoin: round; }
.cv { stroke: var(--cv); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.vs { stroke: var(--ink); stroke-width: 1.2; fill: none; }
.vf { stroke: var(--neg); stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
.vw { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; fill: none; }
</style>
