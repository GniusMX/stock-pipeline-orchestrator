.nn { fill: var(--neg); font-size: 10.5px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.gr { stroke: var(--grid); stroke-width: 1; fill: none; }
