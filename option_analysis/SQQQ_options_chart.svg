.bp { fill: var(--s2); }
.cv { stroke: var(--cv); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.vs { stroke: var(--ink); stroke-width: 1.2; fill: none; }
.vf { stroke: var(--neg); stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
.vw { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; fill: none; }
